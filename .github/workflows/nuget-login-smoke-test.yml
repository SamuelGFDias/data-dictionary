name: NuGet Trusted Publishing Smoke Test

on:
  workflow_dispatch:

jobs:
  login-check:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Confirm success
        run: echo "OIDC exchange succeeded — Trusted Publishing policy is working."
